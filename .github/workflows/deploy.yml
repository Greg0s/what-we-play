name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every Monday: the build draws the week's « Coup de cœur » (src/featured.ts).
  schedule:
    - cron: "7 0 * * 1"
  # Lets a failed deploy be run again from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Full history: the build reads the last commit touching the content to
        # publish an honest dateModified. A shallow clone silently omits it.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # The three Pages actions move together: deploy-pages@v4 stopped finding
      # the artifact that upload-pages-artifact@v3 uploads (every deploy from
      # 2026-11-24 failed with "No artifacts named github-pages were found").
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
