<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/what-we-play.png" />
    <link rel="apple-touch-icon" href="/what-we-play.png" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Fonts are linked here rather than @import-ed from App.scss: an @import
      makes the browser wait for our CSS before it even discovers the Google
      stylesheet, which in turn hides the font files behind a third request.
      The preconnects warm both hosts while the HTML is still parsing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Honk&amp;family=Roboto:ital,wght@0,100..900;1,100..900&amp;family=Teko:wght@300..700&amp;display=swap"
    />

    <!-- Every game card pulls its favicon from this host. -->
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Primary Meta Tags -->
    <title>What we play? Find a game to play online with your friends!</title>
    <meta
      name="description"
      content="Find the best game to play online with your friends based on player count."
    />
    <link rel="canonical" href="https://whatweplay.gregoiretinn.es/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="What we play?" />
    <meta property="og:url" content="https://whatweplay.gregoiretinn.es/" />
    <meta
      property="og:title"
      content="What we play? Find a game to play online with your friends!"
    />
    <meta
      property="og:description"
      content="Find the best game to play online with your friends based on player count."
    />
    <!-- Absolute URL: the Open Graph spec requires one, and every scraper
         (Facebook, LinkedIn, Slack, Discord) fails to resolve a relative path. -->
    <meta
      property="og:image"
      content="https://whatweplay.gregoiretinn.es/what-we-play-metadata.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta
      property="og:image:alt"
      content="What we play? — find a game to play online with your friends"
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="es_ES" />

    <!-- X (Twitter) — the card spec reads name=, not property=. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="What we play? Find a game to play online with your friends!"
    />
    <meta
      name="twitter:description"
      content="Find the best game to play online with your friends based on player count."
    />
    <meta
      name="twitter:image"
      content="https://whatweplay.gregoiretinn.es/what-we-play-metadata.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="What we play? — find a game to play online with your friends"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
