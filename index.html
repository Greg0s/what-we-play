<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/what-we-play.png" />
    <link rel="apple-touch-icon" href="/what-we-play.png" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Sets `data-theme` before the first paint so there is nothing to flash:
      by the time the stylesheet is parsed, the dark CSS variables are already
      in effect if that's what the visitor last chose (or their OS prefers).
      The storage key is duplicated from src/theme/config.ts — this script runs
      before React, and before any bundle, so it cannot import it.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("what-we-play:theme");
          var mode =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {
          // localStorage/matchMedia can be unavailable (private mode, blocked
          // cookies) — falling back to light is not worth failing the page for.
        }
      })();
    </script>

    <!--
      Fonts are linked here rather than @import-ed from App.scss: an @import
      makes the browser wait for our CSS before it even discovers the Google
      stylesheet, which in turn hides the font files behind a third request.
      The preconnects warm both hosts while the HTML is still parsing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the weights the stylesheets actually apply: 600 and 700, with no
      italic anywhere. The previous request pulled both variable axes across
      100..900 and cost 133 kB of latin subsets against 79 kB for this one.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Honk&amp;family=Roboto:wght@400..700&amp;family=Teko:wght@600&amp;display=swap"
    />

    <!-- Every game card pulls its favicon from this host. -->
    <link rel="preconnect" href="https://www.google.com" />

    <!-- Replaced at build time with a preload for the banner, whose hashed
         filename is only known once Vite has written the CSS. -->
    <!--preload:banner-->

    <!-- Shared by every page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="What we play?" />
    <meta
      property="og:image"
      content="https://whatweplay.gregoiretinn.es/what-we-play-metadata.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta
      property="og:image:alt"
      content="What we play? — find a game to play online with your friends"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://whatweplay.gregoiretinn.es/what-we-play-metadata.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="What we play? — find a game to play online with your friends"
    />

    <!--
      Everything between these markers is rewritten per page by
      scripts/prerender.js: title, description, canonical, hreflang and the
      per-locale Open Graph. What sits here is the English home page, which is
      also what `vite dev` serves.
    -->
    <!--head:start-->
    <title>What we play? Find a game to play online with your friends!</title>
    <meta
      name="description"
      content="Find the best game to play online with your friends based on player count."
    />
    <link rel="canonical" href="https://whatweplay.gregoiretinn.es/" />
    <meta property="og:url" content="https://whatweplay.gregoiretinn.es/" />
    <meta
      property="og:title"
      content="What we play? Find a game to play online with your friends!"
    />
    <meta
      property="og:description"
      content="Find the best game to play online with your friends based on player count."
    />
    <meta property="og:locale" content="en_US" />
    <meta
      name="twitter:title"
      content="What we play? Find a game to play online with your friends!"
    />
    <meta
      name="twitter:description"
      content="Find the best game to play online with your friends based on player count."
    />
    <!--head:end-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
