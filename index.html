    <!--
      iOS fills an icon's transparent corners with black, and the logo is black
      on transparent: the home-screen icon is its own opaque 180 × 180 file.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Installable app: the manifest names it, gives Android and desktop their
      icons (a maskable one for Android's shapes) and opens it standalone, at
      "/", which then follows the visitor's language. iOS reads the manifest
      too since 16.4; the apple-* tags cover older versions and set the name
      under the icon. The status bar stays "default" (dark text over the page's
      theme-color): "black-translucent" would slide the page under it.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="What we play?" />

    <!--
      Sets `data-theme` (and `data-relief`) before the first paint so there is nothing to flash:
      by the time the stylesheet is parsed, the dark CSS variables are already
      in effect if that's what the visitor last chose (or, absent a choice,
      what their OS prefers). The storage key is duplicated from
      src/theme/config.ts — this script runs before React, and before any
      bundle, so it cannot import it. A stored "system" is a leftover from
      before the system option was removed and falls back to the OS
      preference, same as no stored value at all.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("what-we-play:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
            // Safari tints its toolbar with this: dark from the first paint,
            // not only once React's ThemeProvider takes over (same colour).
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#141017");
          }
          // Same for the TV: in 3D, show the Mac rather than the flat TV from the
          // first paint. Key duplicated from src/relief/config.ts; 2D is the default.
          if (localStorage.getItem("what-we-play:relief") === "3d")
            document.documentElement.setAttribute("data-relief", "3d");
        } catch (e) {
          // localStorage/matchMedia can be unavailable (private mode, blocked
          // cookies) — falling back to light is not worth failing the page for.
        }
      })();
    </script>

    <!--
      Fonts are linked here rather than @import-ed from App.scss: an @import
      makes the browser wait for our CSS before it even discovers the Google
      stylesheet, which in turn hides the font files behind a third request.
      The preconnects warm both hosts while the HTML is still parsing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Archivo is a variable font: one file per subset covers every width
      (62..125) and weight (400..900) the stylesheets use, so asking for the
      ranges costs nothing more than a single instance. No italic anywhere.
      Honk, the TV's voice, is self-hosted (see the @font-face in App.scss):
      Google serves it as COLRv1 only, which Safari can't draw.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap"
    />
